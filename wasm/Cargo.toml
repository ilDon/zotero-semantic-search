[package]
name = "lealla-wasm"
version = "0.1.0"
edition = "2021"
description = "LEALLA-large sentence encoder forward pass + int8 vector scan, compiled to WebAssembly SIMD"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
