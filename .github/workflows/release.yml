name: Release

# Push a tag like v2.2.0 on a commit of master: the plugin is built with that
# version and published as a GitHub release, together with the updates.json that
# installed copies of the plugin check for automatic updates.
# Run by hand with a tag, it only builds the command-line indexer again and
# attaches it to that existing release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (vX.Y.Z) to attach the macOS indexer to'
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not of the form vX.Y.Z"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $TAG does not point to a commit on master"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Build
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          node scripts/build.mjs --version "$VERSION"
          XPI="build/zotero-semantic-search-$VERSION.xpi"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/zotero-semantic-search-$VERSION.xpi"
          node scripts/updates-json.mjs "$XPI" "$VERSION" "$URL" build/updates.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            "build/zotero-semantic-search-$VERSION.xpi" \
            "build/zotero-semantic-search-$VERSION.mcpb" \
            build/updates.json \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  # Command-line indexer for macOS (Apple silicon), attached to the same release
  cli-macos:
    needs: release
    # also when run by hand, without the release job
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    # macos-latest is Apple silicon; pinned versions are retired after a while
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PDFIUM_TAG: chromium/8076
      PDFIUM_SHA256: 0d6781fe08906baff3d82c90953e519fbc4eb253fe76431e5ed53b157763b97c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download pdfium
        run: |
          curl -sSL -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-mac-arm64.tgz"
          echo "${PDFIUM_SHA256}  pdfium.tgz" | shasum -a 256 -c -
          mkdir -p cli/.pdfium && tar xzf pdfium.tgz -C cli/.pdfium

      - name: Build and test
        working-directory: cli
        run: |
          export SEMSEARCH_VERSION="${TAG#v}"
          cargo test --release
          cargo build --release

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          DIR="semsearch-index-$VERSION-macos-arm64"
          mkdir "$DIR"
          cp cli/target/release/semsearch-index "$DIR/"
          cp cli/.pdfium/lib/libpdfium.dylib "$DIR/"
          cp cli/.pdfium/LICENSE "$DIR/PDFIUM-LICENSE"
          cp cli/README.txt "$DIR/README.txt"
          zip -r -q "$DIR.zip" "$DIR"
          gh release upload "$TAG" "$DIR.zip" --clobber
